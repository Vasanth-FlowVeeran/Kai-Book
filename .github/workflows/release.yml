name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc sign on macOS (no Apple Developer cert needed)
          # To enable proper signing + notarization later, add these secrets:
          #   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'KaiBook ${{ github.ref_name }}'
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Install

            **macOS (Homebrew):**
            ```
            brew tap Vasanth-FlowVeeran/kaibook
            brew install --cask kaibook
            ```

            **Windows (Chocolatey):**
            ```
            choco install kaibook
            ```

            **Manual:** Download the appropriate installer below.
          releaseDraft: true
          prerelease: false
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: |
          echo "After publishing the draft release, run the update scripts"
          echo "for Homebrew and Chocolatey with the new version and SHA256."
