<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaiBook</title>
  <link href="https://fonts.googleapis.com/css2?family=Metrophobic&family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body>

  <!-- ==================== TOOLBAR ==================== -->
  <div class="toolbar" data-tauri-drag-region>
    <div class="toolbar-left">
      <div class="toolbar-brand">
        <span class="brand-icon">📒</span>
        <span class="brand-name">KaiBook</span>
      </div>
      <span class="contact-count" id="contact-count">0 contacts</span>
    </div>
    <div class="toolbar-center">
      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="main-search" placeholder="Search contacts..." spellcheck="false">
      </div>
    </div>
    <div class="toolbar-right">
      <button type="button" class="theme-toggle" id="btn-theme" title="Toggle dark mode">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button type="button" class="toolbar-btn" id="btn-settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <!-- ==================== SETTINGS ==================== -->
  <div id="page-settings" class="page hidden">
    <div class="settings">
      <div class="settings-header">
        <button type="button" class="back-btn" id="btn-back-settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
        <h2 class="settings-title">Settings</h2>
      </div>

      <div class="setting-card">
        <div class="setting-label">Themes</div>
        <div class="theme-grid" id="theme-grid">
          <button type="button" class="theme-card active" data-theme="skeuomorphic">
            <div class="theme-swatches">
              <span class="theme-swatch" style="background:#3a2a1a"></span>
              <span class="theme-swatch" style="background:#c5953a"></span>
              <span class="theme-swatch" style="background:#f5f0e8"></span>
              <span class="theme-swatch" style="background:#2c1810"></span>
            </div>
            <span class="theme-card-name">Skeuomorphic</span>
            <span class="theme-card-check">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
          </button>
          <button type="button" class="theme-card" data-theme="nordic">
            <div class="theme-swatches">
              <span class="theme-swatch" style="background:#2e3440"></span>
              <span class="theme-swatch" style="background:#88c0d0"></span>
              <span class="theme-swatch" style="background:#eceff4"></span>
              <span class="theme-swatch" style="background:#d8dee9"></span>
            </div>
            <span class="theme-card-name">Nordic</span>
            <span class="theme-card-check">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
          </button>
          <button type="button" class="theme-card" data-theme="rosepine">
            <div class="theme-swatches">
              <span class="theme-swatch" style="background:#191724"></span>
              <span class="theme-swatch" style="background:#c4a7e7"></span>
              <span class="theme-swatch" style="background:#e0def4"></span>
              <span class="theme-swatch" style="background:#ebbcba"></span>
            </div>
            <span class="theme-card-name">Ros&eacute; Pine</span>
            <span class="theme-card-check">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
          </button>
          <button type="button" class="theme-card" data-theme="cyberpunk">
            <div class="theme-swatches">
              <span class="theme-swatch" style="background:#05050a"></span>
              <span class="theme-swatch" style="background:#00f0ff"></span>
              <span class="theme-swatch" style="background:#ff003c"></span>
              <span class="theme-swatch" style="background:#39ff14"></span>
            </div>
            <span class="theme-card-name">Cyberpunk</span>
            <span class="theme-card-check">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
          </button>
          <button type="button" class="theme-card" data-theme="paper">
            <div class="theme-swatches">
              <span class="theme-swatch" style="background:#ffffff"></span>
              <span class="theme-swatch" style="background:#1a1a1a"></span>
              <span class="theme-swatch" style="background:#e5e5e5"></span>
              <span class="theme-swatch" style="background:#3b82f6"></span>
            </div>
            <span class="theme-card-name">Paper</span>
            <span class="theme-card-check">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
          </button>
          <button type="button" class="theme-card" data-theme="monokai">
            <div class="theme-swatches">
              <span class="theme-swatch" style="background:#272822"></span>
              <span class="theme-swatch" style="background:#f92672"></span>
              <span class="theme-swatch" style="background:#a6e22e"></span>
              <span class="theme-swatch" style="background:#e6db74"></span>
            </div>
            <span class="theme-card-name">Monokai</span>
            <span class="theme-card-check">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
          </button>
        </div>
      </div>

      <div class="setting-card">
        <div class="setting-label">Keyboard Shortcut</div>
        <div class="hotkey-row">
          <kbd>Ctrl</kbd><span class="hotkey-plus">+</span><kbd>Shift</kbd><span class="hotkey-plus">+</span><kbd>K</kbd>
        </div>
        <p class="setting-hint">Opens the tray popup from anywhere.</p>
      </div>

      <div class="setting-card">
        <div class="setting-label">Data</div>
        <div class="setting-actions">
          <button type="button" class="btn btn-primary" id="btn-export">Export JSON</button>
          <button type="button" class="btn btn-ghost" id="btn-import">Import JSON</button>
        </div>
      </div>

      <div class="setting-card">
        <div class="setting-label">Storage</div>
        <code class="setting-path">~/.kaibook/contacts.json</code>
      </div>

      <div class="setting-card">
        <div class="setting-label">About</div>
        <p class="setting-about">KaiBook v0.1.0 · MIT License</p>
      </div>
    </div>
  </div>

  <!-- ==================== MAIN LIST ==================== -->
  <div id="page-main" class="page">
    <div class="contact-grid" id="contact-list"></div>
    <button type="button" class="add-btn" id="btn-add-contact">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Contact
    </button>
  </div>

  <!-- ==================== EMPTY STATE ==================== -->
  <div id="empty-state" class="empty hidden">
    <div class="empty-visual">
      <div class="empty-circle">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      </div>
    </div>
    <h2 class="empty-title">No contacts yet</h2>
    <p class="empty-desc">Add your first client to see their live local time.</p>
    <button type="button" class="btn btn-primary" id="btn-add-first">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Contact
    </button>
  </div>

  <!-- ==================== MODAL ==================== -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Add Contact</h2>
        <button type="button" class="modal-close" id="modal-close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="contact-form">
        <input type="hidden" id="form-id">
        <div class="form-section">
          <div class="form-group">
            <label for="form-name">Full Name</label>
            <input type="text" id="form-name" required placeholder="e.g. Alice Chen" spellcheck="false">
          </div>
        </div>
        <div class="form-section">
          <div class="form-section-label">Contact</div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-email-primary">Primary Email</label>
              <input type="email" id="form-email-primary" placeholder="alice@company.com" spellcheck="false">
            </div>
            <div class="form-group">
              <label for="form-email-secondary">Secondary Email</label>
              <input type="email" id="form-email-secondary" placeholder="alice@gmail.com" spellcheck="false">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-phone-primary">Primary Phone</label>
              <input type="text" id="form-phone-primary" placeholder="+1 (555) 123-4567">
            </div>
            <div class="form-group">
              <label for="form-phone-secondary">Secondary Phone</label>
              <input type="text" id="form-phone-secondary" placeholder="+1 (555) 987-6543">
            </div>
          </div>
        </div>
        <div class="form-section">
          <div class="form-section-label">Location</div>
          <div class="form-group">
            <label for="form-address">Address</label>
            <input type="text" id="form-address" placeholder="350 Fifth Avenue, New York, NY 10118">
          </div>
          <div class="form-group">
            <label for="form-timezone">Timezone</label>
            <select id="form-timezone" required>
              <option value="">Select timezone</option>
            </select>
          </div>
        </div>
        <div class="form-section">
          <div class="form-group">
            <label for="form-notes">Notes</label>
            <textarea id="form-notes" rows="2" placeholder="Any notes about this client..."></textarea>
          </div>
        </div>
        <div class="form-footer">
          <button type="button" class="btn btn-ghost" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Contact</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== CONFIRM ==================== -->
  <div id="confirm-overlay" class="modal-overlay hidden">
    <div class="confirm">
      <div class="confirm-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <p id="confirm-message" class="confirm-text">Are you sure?</p>
      <div class="confirm-actions">
        <button type="button" class="btn btn-ghost" id="btn-confirm-cancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="btn-confirm-ok">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
