<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90">
  <defs>
    <radialGradient id="ev-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="90" height="90" rx="45" fill="#0a0a14"/>
  <!-- outer glow -->
  <circle cx="45" cy="45" r="36" fill="url(#ev-glow)"/>
  <!-- moon orb -->
  <circle cx="45" cy="45" r="18" fill="#a855f7"/>
  <!-- inner highlight -->
  <circle cx="40" cy="40" r="12" fill="#c084fc" opacity="0.35"/>
  <!-- bright center -->
  <circle cx="45" cy="45" r="8" fill="#c4b5fd" opacity="0.25"/>
</svg>
