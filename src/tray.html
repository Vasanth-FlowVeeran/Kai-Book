<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaiBook Tray</title>
  <link rel="stylesheet" href="tray.css">
</head>
<body>
  <div class="tray-container">
    <div class="tray-header">☕ KaiBook</div>

    <div class="tray-search">
      <input type="text" id="tray-search-input" placeholder="Quick search..." autofocus>
    </div>

    <div class="tray-contact-list" id="tray-contact-list">
      <!-- contacts rendered here -->
    </div>

    <!-- Quick Add inline form (hidden by default) -->
    <div id="quick-add-form" class="quick-add-form hidden">
      <input type="text" id="qa-name" placeholder="Name *" class="qa-input">
      <input type="text" id="qa-email" placeholder="Email" class="qa-input">
      <input type="text" id="qa-phone" placeholder="Phone" class="qa-input">
      <select id="qa-timezone" class="qa-input">
        <option value="">Timezone (optional)</option>
      </select>
      <div class="qa-buttons">
        <button type="button" class="tray-btn qa-cancel" id="qa-cancel">Cancel</button>
        <button type="button" class="tray-btn qa-save" id="qa-save">Save</button>
      </div>
    </div>

    <div class="tray-actions" id="tray-actions">
      <button type="button" class="tray-btn" id="tray-quick-add">+ Quick Add</button>
      <button type="button" class="tray-btn" id="tray-open-main">Open KaiBook</button>
      <button type="button" class="tray-btn tray-btn-danger" id="tray-exit">Exit</button>
    </div>
  </div>

  <script src="tray.js"></script>
</body>
</html>
